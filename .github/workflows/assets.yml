name: Profile assets
"on":
  schedule: [{cron: "17 4 * * 1"}]  # Mondays, 04:17 UTC
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/assets.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -B -m unittest discover -s tests -v

  render:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    concurrency:
      group: profile-assets
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Use METRICS_TOKEN only to include aggregates visible to that token.
      # The built-in token suffices for the public profile.
      - name: Render cover.svg and metrics.svg
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
        run: |
          python3 scripts/gen_cover.py --user jtprogru --output assets/cover.svg
          python3 scripts/gen_metrics.py --user jtprogru --output assets/metrics.svg
      - name: Commit
        run: |
          if git diff --quiet -- assets/; then
            echo "assets unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "chore(assets): refresh profile SVGs - [Skip GitHub Action]"
          git pull --rebase origin main
          git push
