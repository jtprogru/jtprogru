<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Mikhail Savin (Мишка на сервере), @jtprogru — SRE, Infrastructure and Cloud Engineer. Pinned projects: The-Way-of-SRE, srekit, notiflow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#111823"/>
      <stop offset="100%" stop-color="#0a1a26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#0e75b6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8b949e" fill-opacity="0.12"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="420" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <ellipse cx="900" cy="60" rx="420" ry="280" fill="url(#glow)"/>
    <rect x="0" y="0" width="6" height="420" fill="url(#accent)"/>

    <!-- ============ left column: identity ============ -->
    <text x="64" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#3fb950">$ whoami</text>

    <text x="64" y="124" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#e6edf3">Mikhail Savin</text>

    <text x="64" y="158" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#e3b341">Мишка на сервере</text>

    <text x="64" y="190" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#58a6ff">@jtprogru</text>

    <text x="64" y="220" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">SRE · Infrastructure Engineer · Cloud Engineer</text>

    <line x1="64" y1="246" x2="560" y2="246" stroke="#30363d"/>

    <!-- stats -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <g>
        <text x="64" y="288" font-size="26" font-weight="700" fill="#e6edf3">5 199</text>
        <text x="64" y="308" font-size="11" fill="#8b949e" letter-spacing="1">COMMITS</text>
      </g>
      <g>
        <text x="194" y="288" font-size="26" font-weight="700" fill="#e6edf3">353</text>
        <text x="194" y="308" font-size="11" fill="#8b949e" letter-spacing="1">PRs OPENED</text>
      </g>
      <g>
        <text x="334" y="288" font-size="26" font-weight="700" fill="#e6edf3">180</text>
        <text x="334" y="308" font-size="11" fill="#8b949e" letter-spacing="1">REPOS</text>
      </g>
      <g>
        <text x="444" y="288" font-size="26" font-weight="700" fill="#e6edf3">77</text>
        <text x="444" y="308" font-size="11" fill="#8b949e" letter-spacing="1">FOLLOWERS</text>
      </g>
    </g>

    <text x="64" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8b949e">jtprog.ru<tspan fill="#30363d">  ·  </tspan>savinmi.ru<tspan fill="#30363d">  ·  </tspan>t.me/jtprogru_channel</text>

    <text x="64" y="380" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6e7681">12 years on GitHub  ·  contributed to 93 repositories</text>

    <!-- ============ right column: pinned ============ -->
    <line x1="624" y1="48" x2="624" y2="372" stroke="#21262d"/>

    <text x="660" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#3fb950">$ ls ~/pinned</text>

    <!-- card 1 -->
    <g>
      <rect x="660" y="92" width="476" height="92" rx="10" fill="#161b22" stroke="#30363d"/>
      <text x="680" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#58a6ff">The-Way-of-SRE</text>
      <text x="680" y="146" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">Проект, посвящённый развитию в SRE-направлении:</text>
      <text x="680" y="164" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">материалы, roadmap, практика.</text>
      <g text-anchor="end">
        <circle cx="1022" cy="118" r="5" fill="#fcb32c"/>
        <text x="1116" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">MDX  ★ 12</text>
      </g>
    </g>

    <!-- card 2 -->
    <g>
      <rect x="660" y="196" width="476" height="92" rx="10" fill="#161b22" stroke="#30363d"/>
      <text x="680" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#58a6ff">srekit</text>
      <text x="680" y="250" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">SRE text artifact generator: postmortems, runbooks,</text>
      <text x="680" y="268" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">RFCs, SLOs. Single binary, JSON-pipelineable.</text>
      <g text-anchor="end">
        <circle cx="1036" cy="222" r="5" fill="#00ADD8"/>
        <text x="1116" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">Go  ★ 8</text>
      </g>
    </g>

    <!-- card 3 -->
    <g>
      <rect x="660" y="300" width="476" height="92" rx="10" fill="#161b22" stroke="#30363d"/>
      <text x="680" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#58a6ff">notiflow</text>
      <text x="680" y="354" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">Telegram notifier for CI and the terminal — a GitHub</text>
      <text x="680" y="372" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">Action and a CLI in one Rust binary.</text>
      <g text-anchor="end">
        <circle cx="1026" cy="326" r="5" fill="#dea584"/>
        <text x="1116" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">Rust  ★ 3</text>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="419" rx="16" fill="none" stroke="#30363d"/>
  </g>
</svg>
